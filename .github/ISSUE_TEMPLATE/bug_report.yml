name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: App version and OS
      placeholder: 1.0.0, macOS 15
    validations:
      required: true
  - type: input
    id: miniserver
    attributes:
      label: Miniserver generation / firmware
      placeholder: Gen 2, 16.1.5
